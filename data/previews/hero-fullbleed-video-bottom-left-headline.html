<section class="lb-root" data-header="overlay">
  <style>
    .lb-root { position: relative; display: flex; flex-direction: column; background: var(--lb-bg); overflow-x: clip; height: 100vh; padding-top: var(--header-h); box-sizing: border-box; }
    .lb-root[data-header="overlay"] { height: 100vh; padding-top: var(--header-h); }
    .lb-root[data-header="below"], .lb-root[data-header="inset"] { height: calc(100vh - var(--header-h)); padding-top: 0; }
    .lb-root[data-header="after"] { height: 100vh; padding-top: 0; }
    .lb-root .bg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    .lb-root .inner { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: var(--lb-space); }
    .lb-root .copy { display: flex; flex-direction: column; gap: var(--lb-gap); width: 60%; }
    @media (max-width: 640px) {
      .lb-root { height: 100vh; height: 100svh; }
      .lb-root[data-header="overlay"] { height: 100vh; height: 100svh; }
      .lb-root[data-header="below"], .lb-root[data-header="inset"] { height: calc(100vh - var(--header-h)); height: calc(100svh - var(--header-h)); }
      .lb-root[data-header="after"] { height: 100vh; height: 100svh; }
      .lb-root .copy { width: 100%; }
      .lb-root .copy .sub { order: 2; }
      .lb-root .copy .lb-h1 { order: 1; }
    }
  </style>
  <div class="lb-video lb-flat lb-tag-tr bg"></div>
  <div class="inner">
    <div class="lb-wrap">
      <div class="copy lb-invert">
        <div class="lb-h3 sub">Subtitle goes here</div>
        <div class="lb-h1">Headline goes here across multiple lines</div>
      </div>
    </div>
  </div>
</section>
