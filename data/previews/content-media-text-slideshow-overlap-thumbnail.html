<section class="lb-root">
  <style>
    .lb-root { background: var(--lb-bg); padding: var(--lb-space) 0; overflow-x: clip; }
    .lb-root .cols { display: grid; grid-template-columns: 4fr 6fr; gap: var(--lb-gap); align-items: center; padding-bottom: 48px; }
    .lb-root .txt { display: flex; flex-direction: column; align-items: flex-start; gap: var(--lb-gap); text-align: left; }
    .lb-root .stage { position: relative; }
    .lb-root .slides { position: relative; aspect-ratio: 16 / 10; }
    .lb-root .slide { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .5s; border-radius: var(--lb-r-tl) var(--lb-r-tr) var(--lb-r-br) var(--lb-r-bl); }
    .lb-root .slide.on { opacity: 1; }
    .lb-root .dots { position: absolute; left: 0; right: 0; bottom: var(--lb-gap); display: flex; justify-content: center; gap: 8px; }
    .lb-root .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--lb-line); border: 0; padding: 0; cursor: pointer; transition: width .3s; }
    .lb-root .dot.on { width: 24px; background: var(--lb-accent); }
    .lb-root .counter { position: absolute; right: var(--lb-gap); bottom: var(--lb-gap); width: 56px; height: 56px; border-radius: 50%; background: var(--lb-bg); display: flex; align-items: center; justify-content: center; }
    .lb-root .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .lb-root .ring circle { fill: none; stroke-width: 2; }
    .lb-root .rt { stroke: var(--lb-line); }
    .lb-root .rp { stroke: var(--lb-accent); stroke-dasharray: 100.53; stroke-dashoffset: 100.53; }
    .lb-root .thumb { position: absolute; left: -22%; bottom: -40px; width: 30%; aspect-ratio: 1 / 1; z-index: 2; border-radius: var(--lb-r-tl) var(--lb-r-tr) var(--lb-r-br) var(--lb-r-bl); }
    .lb-root .badge { position: absolute; left: var(--lb-gap); top: var(--lb-gap); z-index: 2; background: var(--lb-bg); border: 1px solid var(--lb-line); padding: 4px 10px; }
    @media (max-width: 640px) {
      .lb-root .cols { grid-template-columns: 1fr; padding-bottom: 0; }
      .lb-root .stage { order: -1; }
      .lb-root .txt { align-items: center; text-align: center; }
      .lb-root .thumb { display: none; }
      .lb-root .counter { width: 44px; height: 44px; }
      .lb-root .badge { left: 50%; top: 0; transform: translate(-50%, -50%); }
    }
  </style>
  <div class="lb-wrap">
    <div class="cols">
      <div class="txt">
        <span class="lb-label">Label</span>
        <h2 class="lb-h2">Headline goes here across lines</h2>
        <p class="lb-text">Supporting description text goes here for the block</p>
        <a class="lb-btn">Learn more</a>
      </div>
      <div class="stage">
        <div class="slides"><div class="lb-img slide on"></div><div class="lb-img slide"></div><div class="lb-img slide"></div></div>
        <span class="lb-label badge">Tag</span>
        <div class="dots"><button class="dot on" type="button" aria-label="Slide"></button><button class="dot" type="button" aria-label="Slide"></button><button class="dot" type="button" aria-label="Slide"></button></div>
        <div class="counter"><svg class="ring" viewBox="0 0 36 36"><circle class="rt" cx="18" cy="18" r="16"/><circle class="rp" cx="18" cy="18" r="16"/></svg><span class="lb-label num">1/3</span></div>
        <div class="lb-img thumb lb-notag"></div>
      </div>
    </div>
  </div>
  <script type="text/lb">
    const s = root.querySelectorAll('.slide'), d = root.querySelectorAll('.dot'), n = root.querySelector('.num'), rp = root.querySelector('.rp');
    const L = 100.53, T = 4000;
    let i = 0, t0 = performance.now(), raf = 0;
    const go = k => { s[i].classList.remove('on'); d[i].classList.remove('on'); i = k; s[i].classList.add('on'); d[i].classList.add('on'); n.textContent = (i+1)+'/'+s.length; t0 = performance.now(); };
    const hs = [];
    d.forEach((el, k) => { const h = () => go(k); el.addEventListener('click', h); hs.push([el, h]); });
    ctx.onCleanup(() => hs.forEach(([el, h]) => el.removeEventListener('click', h)));
    if (!ctx.reducedMotion) {
      const tick = now => { const p = Math.min((now - t0) / T, 1); rp.style.strokeDashoffset = L * (1 - p); if (p >= 1) go((i+1)%s.length); raf = requestAnimationFrame(tick); };
      raf = requestAnimationFrame(tick);
      ctx.onCleanup(() => cancelAnimationFrame(raf));
    }
  </script>
</section>
