<section class="lb-root">
  <style>
    .lb-root { background: var(--lb-bg); padding: var(--lb-space) 0; border-radius: var(--lb-r-tl) var(--lb-r-tr) var(--lb-r-br) var(--lb-r-bl); overflow-x: clip; }
    .lb-root .inner { max-width: 1200px; margin: 0 auto; padding: 0 var(--lb-gutter); }
    .lb-root .head { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; margin-bottom: var(--lb-space); }
    .lb-root .feat { display: grid; grid-template-columns: 1fr 1fr; gap: var(--lb-gap); align-items: center; margin-bottom: var(--lb-space); }
    .lb-root .feat .pic { aspect-ratio: 16 / 10; width: 100%; }
    .lb-root .ftxt { display: flex; flex-direction: column; gap: var(--lb-gap); padding: var(--lb-pad); }
    .lb-root .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--lb-gap); }
    .lb-root .item { display: flex; flex-direction: column; gap: 8px; }
    .lb-root .item .pic { aspect-ratio: 16 / 10; width: 100%; }
    .lb-root .more { display: flex; justify-content: center; margin-top: var(--lb-space); }
    @media (max-width: 1024px) { .lb-root .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) {
      .lb-root .feat { grid-template-columns: 1fr; padding: 0; gap: 0; }
      .lb-root .feat .pic { margin: 0 -12px; width: calc(100% + 24px); }
      .lb-root .grid { grid-template-columns: 1fr; }
      .lb-root .more { justify-content: flex-start; }
    }
  </style>
  <div class="inner">
    <div class="head"><h2 class="lb-h1">Headline goes here across lines</h2><p class="lb-text">Subtitle goes here</p></div>
    <div class="feat">
      <div class="lb-img pic"></div>
      <div class="ftxt"><h2 class="lb-h2">Featured title goes here</h2><p class="lb-text">Description text goes here for the featured item</p><p class="lb-small">Secondary text</p><span class="lb-label">Tag</span></div>
    </div>
    <div class="grid">
      <div class="item"><div class="lb-img pic"></div><h3 class="lb-h3">Item title goes here</h3><p class="lb-small">Secondary text</p><span class="lb-label">Tag</span></div>
      <div class="item"><div class="lb-img pic"></div><h3 class="lb-h3">Item title goes here</h3><p class="lb-small">Secondary text</p><span class="lb-label">Tag</span></div>
      <div class="item"><div class="lb-img pic"></div><h3 class="lb-h3">Item title goes here</h3><p class="lb-small">Secondary text</p><span class="lb-label">Tag</span></div>
    </div>
    <div class="more"><a class="lb-btn">View all</a></div>
  </div>
</section>
