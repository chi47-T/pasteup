<section class="lb-root">
  <style>
    .lb-root { background: var(--lb-bg); padding: calc(var(--lb-space) * 1.8) 0 calc(var(--lb-space) * 0.6); overflow-x: clip; }
    .lb-root .cols { display: grid; grid-template-columns: 40% 40%; justify-content: space-between; align-items: end; }
    .lb-root .list { display: flex; flex-direction: column; }
    .lb-root .row { display: flex; align-items: baseline; gap: var(--lb-gap); padding: var(--lb-pad) 0; border-bottom: 1px solid var(--lb-line); text-decoration: none; }
    .lb-root .row:first-child { padding-top: 0; }
    .lb-root .row .lb-arrow { margin-left: auto; flex: none; }
    .lb-root .pair { display: flex; gap: var(--lb-gap); }
    .lb-root .pair .lb-img { flex: 1 1 0; min-width: 0; aspect-ratio: 3 / 5; }
    @media (max-width: 640px) {
      .lb-root .cols { display: flex; flex-direction: column; gap: var(--lb-space); }
      .lb-root .pair { order: -1; width: 60%; align-self: flex-end; }
      .lb-root .list { width: 100%; }
    }
  </style>
  <div class="lb-wrap">
    <div class="cols">
      <div class="list">
        <a class="row"><span class="lb-h3">Item one</span><span class="lb-small">Secondary text</span><span class="lb-arrow"></span></a>
        <a class="row"><span class="lb-h3">Item two</span><span class="lb-small">Secondary text</span><span class="lb-arrow"></span></a>
        <a class="row"><span class="lb-h3">Item three</span><span class="lb-small">Secondary text</span><span class="lb-arrow"></span></a>
        <a class="row"><span class="lb-h3">Item four</span><span class="lb-small">Secondary text</span><span class="lb-arrow"></span></a>
      </div>
      <div class="pair">
        <div class="lb-img"></div>
        <div class="lb-img"></div>
      </div>
    </div>
  </div>
</section>
