<section class="lb-root">
  <style>
    .lb-root { padding: var(--lb-space) 0; background: var(--lb-bg); }
    .lb-root .head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--lb-gap); margin-bottom: var(--lb-space); }
    .lb-root .rows { display: flex; flex-direction: column; gap: var(--lb-gap); }
    .lb-root .wide { display: grid; grid-template-columns: 1fr 1.4fr 4fr; gap: var(--lb-gap); align-items: center; padding: var(--lb-pad); box-sizing: border-box; }
    .lb-root .wide .lb-img { width: 100%; aspect-ratio: 16 / 9; }
    .lb-root .wide .lb-btn { width: 100%; box-sizing: border-box; padding-top: 28px; padding-bottom: 28px; }
    .lb-root .two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--lb-gap); }
    .lb-root .split { display: grid; grid-template-columns: 1fr 2fr; }
    .lb-root .split .lb-img { height: 100%; min-height: 180px; border-radius: var(--lb-r-tl) 0 0 var(--lb-r-bl); }
    .lb-root .split .txt { display: flex; flex-direction: column; align-items: stretch; gap: var(--lb-gap); padding: var(--lb-pad); }
    @media (max-width: 640px) {
      .lb-root .wide { grid-template-columns: 1fr; justify-items: center; text-align: center; }
      .lb-root .wide .lb-h3 { order: 1; }
      .lb-root .wide .lb-img { order: 2; }
      .lb-root .wide .lb-btn { order: 3; }
      .lb-root .two { grid-template-columns: 1fr; }
      .lb-root .split { grid-template-columns: 1fr; }
      .lb-root .split .lb-img { height: auto; min-height: 0; aspect-ratio: 16 / 9; border-radius: var(--lb-r-tl) var(--lb-r-tr) 0 0; }
    }
  </style>
  <div class="lb-wrap">
    <div class="head"><h2 class="lb-h2">Section heading goes here</h2></div>
    <div class="rows">
      <div class="lb-card wide">
        <div class="lb-img"></div>
        <h3 class="lb-h3">Wide card title goes here</h3>
        <a class="lb-btn">Large button</a>
      </div>
      <div class="two">
        <div class="lb-card lb-nopad split"><div class="lb-img lb-flat"></div><div class="txt"><h3 class="lb-h3">Card title</h3><div class="lb-text">Description text placeholder for the card</div><a class="lb-btn lb-block">Button</a></div></div>
        <div class="lb-card lb-nopad split"><div class="lb-img lb-flat"></div><div class="txt"><h3 class="lb-h3">Card title</h3><div class="lb-text">Description text placeholder for the card</div><a class="lb-btn lb-block">Button</a></div></div>
      </div>
    </div>
  </div>
</section>
