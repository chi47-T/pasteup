<section class="lb-root">
  <style>
    .lb-root { padding: var(--lb-space) 0; background: var(--lb-bg); }
    .lb-root .head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--lb-gap); margin-bottom: var(--lb-space); }
    .lb-root .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--lb-gap); }
    .lb-root .lb-card { position: relative; display: flex; flex-direction: column; overflow: visible; }
    .lb-root .lb-card .lb-img { width: 100%; aspect-ratio: 16 / 9; border-radius: var(--lb-r-tl) var(--lb-r-tr) 0 0; }
    .lb-root .lb-card .txt { padding: var(--lb-pad); padding-top: calc(var(--lb-pad) + 12px); display: flex; flex-direction: column; gap: 8px; }
    .lb-root .lb-card .tagw { position: absolute; left: var(--lb-pad); z-index: 2; transform: translateY(-50%); }
    .lb-root .lb-card .imgw { position: relative; }
    .lb-root .lb-card .imgw .tagw { left: var(--lb-pad); bottom: 0; top: auto; transform: translateY(50%); }
    .lb-root .more { display: flex; justify-content: center; margin-top: var(--lb-space); }
    .lb-root .more .lb-btn { min-width: 280px; justify-content: center; }
    @media (max-width: 1024px) { .lb-root .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) {
      .lb-root .grid { grid-template-columns: 1fr; }
      .lb-root .lb-card { flex-direction: row; align-items: flex-start; gap: var(--lb-gap); padding: var(--lb-pad); }
      .lb-root .lb-card .imgw { width: 30%; flex: none; }
      .lb-root .lb-card .lb-img { border-radius: var(--lb-r-tl) var(--lb-r-tr) var(--lb-r-br) var(--lb-r-bl); }
      .lb-root .lb-card .txt { padding: 0; flex: 1; }
      .lb-root .lb-card .imgw .tagw { position: static; transform: none; }
      .lb-root .more .lb-btn { width: 100%; box-sizing: border-box; }
    }
  </style>
  <div class="lb-wrap">
    <div class="head"><h2 class="lb-h2">Section heading goes here</h2></div>
    <div class="grid">
      <div class="lb-card lb-nopad"><div class="imgw"><div class="lb-img lb-flat"></div><span class="tagw lb-label">Label</span></div><div class="txt"><h3 class="lb-h3">Card title goes here</h3></div></div>
      <div class="lb-card lb-nopad"><div class="imgw"><div class="lb-img lb-flat"></div><span class="tagw lb-label">Label</span></div><div class="txt"><h3 class="lb-h3">Card title goes here</h3></div></div>
      <div class="lb-card lb-nopad"><div class="imgw"><div class="lb-img lb-flat"></div><span class="tagw lb-label">Label</span></div><div class="txt"><h3 class="lb-h3">Card title goes here</h3></div></div>
    </div>
    <div class="more"><a class="lb-btn">Button</a></div>
  </div>
</section>
