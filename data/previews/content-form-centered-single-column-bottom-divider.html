<section class="lb-root">
  <style>
    .lb-root { padding-top: var(--lb-space); }
    .lb-root .inner { padding-bottom: 25vh; }
    .lb-root .head { display: flex; flex-direction: column; align-items: center; gap: var(--lb-gap); text-align: center; margin-bottom: var(--lb-space); }
    .lb-root .form { width: 66%; margin: 0 auto; display: flex; flex-direction: column; gap: var(--lb-gap); }
    .lb-root .field { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
    .lb-root .field .lb-input { width: 100%; box-sizing: border-box; }
    .lb-root .field .tall { min-height: 140px; }
    .lb-root .consent { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .lb-root .box { width: 16px; height: 16px; border: 1px solid var(--lb-line); flex: none; }
    .lb-root .submit { display: flex; justify-content: center; }
    .lb-root .submit .lb-btn { padding-left: 3em; padding-right: 3em; min-height: 56px; font-size: 1.1em; }
    @media (max-width: 640px) { .lb-root .form { width: 100%; } }
  </style>
  <div class="lb-wrap inner">
    <div class="head"><h2 class="lb-h2 lb-center">Headline goes here</h2></div>
    <div class="form">
      <div class="field"><span class="lb-label">Label</span><div class="lb-input"></div></div>
      <div class="field"><span class="lb-label">Label</span><div class="lb-input"></div></div>
      <div class="field"><span class="lb-label">Label</span><div class="lb-input"></div></div>
      <div class="field"><span class="lb-label">Label</span><div class="lb-input tall"></div></div>
      <div class="submit"><button class="lb-btn">Submit</button></div>
    </div>
  </div>
  <div class="lb-divider"></div>
</section>
