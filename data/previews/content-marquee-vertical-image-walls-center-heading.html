<section class="lb-root">
  <style>
    .lb-root { height: 100vh; overflow: hidden; padding: 0; }
    .lb-root .grid3 { display: grid; grid-template-columns: 2fr 1fr 2fr; height: 100%; width: 100%; }
    .lb-root .wall { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; height: 100%; overflow: hidden; min-width: 0; }
    .lb-root .col { overflow: hidden; height: 100%; }
    .lb-root .track { display: flex; flex-direction: column; gap: 2px; animation: lb-up linear infinite; }
    .lb-root .pic { width: 100%; flex: none; }
    @keyframes lb-up { from { transform: translateY(0); } to { transform: translateY(-50%); } }
    .lb-root .center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 32px; padding: 0 var(--lb-pad); min-width: 0; }
    .lb-root .center .lb-h2 { writing-mode: vertical-rl; text-orientation: upright; font-size: 22px; }
    .lb-root .center .lb-divider-v { align-self: center; margin: 0 auto; width: 1px; height: 48px; flex: none; }
    .lb-root .more { display: inline-flex; align-items: center; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--lb-ink); }
    .lb-root .mobile { display: none; }
    @media (prefers-reduced-motion: reduce) { .lb-root .track, .lb-root .mtrack { animation: none; } }
    @media (max-width: 640px) {
      .lb-root { height: auto; overflow-x: clip; }
      .lb-root .grid3 { display: flex; flex-direction: column; height: auto; }
      .lb-root .wall { display: none; }
      .lb-root .mobile { display: block; overflow: hidden; }
      .lb-root .mband { display: flex; flex-direction: column; gap: 2px; }
      .lb-root .mrow { overflow: hidden; }
      .lb-root .mtrack { display: flex; gap: 2px; width: max-content; animation: lb-left 30s linear infinite; }
      .lb-root .mband .b1 { width: 100px; min-width: 100px; max-width: none; height: 140px; flex: 0 0 100px; }
      .lb-root .mband .b2 { width: 180px; min-width: 180px; max-width: none; height: 140px; flex: 0 0 180px; }
      @keyframes lb-left { from { transform: translateX(0); } to { transform: translateX(-50%); } }
      .lb-root .center { padding: var(--lb-space) var(--lb-gutter); gap: 24px; }
      .lb-root .center .lb-h2 { writing-mode: horizontal-tb; text-orientation: mixed; font-size: 24px; }
      .lb-root .center .lb-divider-v { align-self: center; margin: 0 auto; width: 48px; height: 1px; }
      .lb-root .more { align-self: stretch; justify-content: space-between; }
    }
  </style>
