<section class="lb-root">
  <style>
    .lb-root { background: var(--lb-bg); padding: var(--lb-space) 0; }
    .lb-root .stack { display: flex; flex-direction: column; align-items: center; text-align: center; gap: calc(var(--lb-gap) * 1.5); }
    .lb-root .lb-icon { width: 40px; height: 40px; }
    .lb-root .head { width: 25vw; min-width: 240px; max-width: 100%; }
    .lb-root .btns { display: flex; justify-content: center; gap: 0; width: 50vw; min-width: 280px; max-width: 100%; column-gap: calc(50vw / 2 / 7); }
    .lb-root .big-btn { flex: 1 1 0; min-width: 0; height: 96px; display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 0 var(--lb-pad); }
    .lb-root .big-btn .lb-icon { width: 24px; height: 24px; flex: none; }
    @media (max-width: 640px) {
      .lb-root .head { width: 100%; min-width: 0; }
      .lb-root .btns { width: 100%; min-width: 0; column-gap: var(--lb-gap); }
      .lb-root .big-btn { flex: 0 0 auto; width: 40vw; height: auto; aspect-ratio: 1 / 1; flex-direction: column; text-align: center; padding: var(--lb-pad) calc(var(--lb-pad) / 2); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .lb-root[data-armed] .reveal { opacity: 0; transition: opacity .6s ease; }
      .lb-root[data-armed][data-in] .reveal { opacity: 1; }
    }
  </style>
  <div class="lb-wrap">
    <div class="stack">
      <span class="lb-icon reveal"></span>
      <h2 class="lb-h2 head reveal">Headline goes here</h2>
      <div class="btns">
        <a class="lb-btn big-btn"><span class="lb-icon"></span><span>Button</span></a>
        <a class="lb-btn big-btn"><span class="lb-icon"></span><span>Button</span></a>
      </div>
    </div>
  </div>
  <script type="text/lb">
    if (!ctx.extras.includes(0) || ctx.reducedMotion || !('IntersectionObserver' in window)) return;
    root.setAttribute('data-armed', '');
    const io = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) { root.setAttribute('data-in', ''); io.disconnect(); } }); }, { threshold: 0.3 });
    io.observe(root);
    ctx.onCleanup(() => io.disconnect());
  </script>
</section>
