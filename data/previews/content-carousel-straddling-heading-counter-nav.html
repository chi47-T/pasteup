<section class="lb-root">
  <style>
    .lb-root { --per: 4; margin-top: -80px; padding-bottom: var(--lb-space); position: relative; }
    .lb-root { overflow-x: clip; }
    .lb-root .vp { overflow: hidden; }
    .lb-root .track { display: flex; gap: var(--lb-gap); transition: transform .4s; }
    .lb-root .track > * { flex: 0 0 calc((100% - (var(--per) - 1) * var(--lb-gap)) / var(--per)); min-width: 0; }
    .lb-root .ctrl { display: flex; justify-content: space-between; align-items: center; width: 33%; min-width: 240px; margin: var(--lb-gap) auto 0; }
    .lb-root .counter { display: inline-flex; align-items: center; gap: 8px; }
    .lb-root .dash { width: 16px; height: 1px; background: var(--lb-ink); display: inline-block; }
    .lb-root .head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
    .lb-root .head { margin-bottom: calc(var(--lb-space) * 0.8); }
    .lb-root .desc { width: 33%; min-width: 240px; margin: 0 auto calc(var(--lb-space) * 0.6); display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .lb-root .pic { aspect-ratio: 4 / 3; width: 100%; }
    .lb-root .more { display: flex; justify-content: center; margin-top: var(--lb-gap); }
    @media (max-width: 640px) {
      .lb-root { --per: 1; margin-top: -60px; }
      .lb-root .ctrl { width: 100%; min-width: 0; }
      .lb-root .vp { overflow: visible; }
      .lb-root .track > * { flex-basis: 82%; }
      .lb-root .desc { width: 100%; min-width: 0; }
    }
    /* 跨在交界上：區塊上方用自己的留白（不是外距）容納往上移的標題組，留白和頁面同色、下方才是本區塊的底色，整個區塊不透明，只有標題組往上移，不蓋到上一個區塊 */
    .lb-root { --shift: calc(19px + 12px + clamp(34px, 4.6vw, 68px) * 0.56); margin-top: 0; padding-top: var(--shift); background: var(--lb-surface-2); position: relative; z-index: 1; }
    .lb-root .head { position: relative; z-index: 1; margin-top: 0; transform: translateY(calc(-1 * var(--shift))); margin-bottom: calc(calc(var(--lb-space) * 0.8) - var(--shift)); }
    .lb-root::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: var(--shift); background: var(--lb-bg); z-index: 0; pointer-events: none; }
  </style>
  <div class="lb-wrap">
    <div class="head"><span class="lb-label">Tag</span><h2 class="lb-h1">Headline goes here across two lines</h2><p class="lb-h3">Subheading</p></div>
    <div class="desc"><p class="lb-text">Description text placeholder of similar length.</p><p class="lb-text">Second line of description text.</p></div>
    <div class="vp"><div class="track">
<div><div class="lb-img pic"></div></div>
<div><div class="lb-img pic"></div></div>
<div><div class="lb-img pic"></div></div>
<div><div class="lb-img pic"></div></div>
<div><div class="lb-img pic"></div></div>
<div><div class="lb-img pic"></div></div>
<div><div class="lb-img pic"></div></div>
<div><div class="lb-img pic"></div></div>
</div></div>
    <div class="ctrl"><button class="lb-icon-btn prev"><span class="lb-arrow lb-arrow-left"></span></button><span class="lb-label counter"><span class="cur">1</span> <span class="dash"></span> <span class="tot">1</span></span><button class="lb-icon-btn next"><span class="lb-arrow"></span></button></div>
    <div class="more"><button class="lb-btn">Button</button></div>
  </div>
  <script type="text/lb">
    const vp = root.querySelector('.vp'), track = root.querySelector('.track');
    const items = [...track.children];
    const prev = root.querySelector('.prev'), next = root.querySelector('.next');
    const cur = root.querySelector('.cur'), tot = root.querySelector('.tot');
    let page = 0;
    const per = () => parseInt(getComputedStyle(root).getPropertyValue('--per')) || 1;
    const pages = () => Math.ceil(items.length / per());
    const render = () => {
      const p = per(); page = Math.min(page, pages() - 1);
      const idx = Math.min(page * p, items.length - p);
      track.style.transform = 'translateX(' + (-items[Math.max(idx, 0)].offsetLeft + items[0].offsetLeft) + 'px)';
      cur.textContent = page + 1; tot.textContent = pages();
    };
    prev.addEventListener('click', () => { page = Math.max(0, page - 1); render(); });
    next.addEventListener('click', () => { page = Math.min(pages() - 1, page + 1); render(); });
    window.addEventListener('resize', render);
    ctx.onCleanup(() => window.removeEventListener('resize', render));
    render();
  </script>
</section>
