<header class="lb-root">
  <style>
    .lb-root { position: relative; height: 80px; z-index: 50; }
    .lb-root[data-over] { position: fixed; left: 0; right: 0; top: 0; height: 0; background: none; }
    .lb-root .logo { position: fixed; left: 16px; top: 12px; width: 56px; height: 24px; z-index: 50; }
    .lb-root .menu-btn { position: fixed; right: 16px; bottom: 16px; width: calc(100vw / 6); min-width: 150px; z-index: 60; display: flex; align-items: center; justify-content: center; gap: var(--lb-gap); }
    .lb-root .menu-ill { position: absolute; left: 8px; top: -14px; width: 36px; height: 36px; }
    .lb-root .panel { position: fixed; right: 16px; bottom: 72px; width: 280px; max-width: calc(100vw - 32px); z-index: 55; display: none; flex-direction: column; gap: var(--lb-gap); padding: var(--lb-pad); background: var(--lb-bg); border: 1px solid var(--lb-line); border-radius: var(--lb-r-tl) var(--lb-r-tr) var(--lb-r-br) var(--lb-r-bl); }
    .lb-root.open .panel { display: flex; }
    @media (max-width: 1024px) {
      .lb-root .menu-btn { right: 16px; left: 16px; width: auto; min-width: 0; bottom: 16px; }
      .lb-root .menu-ill { display: none; }
      .lb-root .panel { right: 16px; left: 16px; bottom: 72px; width: auto; max-width: none; }
      .lb-root.scrolled .logo { display: none; }
    }
  </style>
  <div class="logo lb-logo">Logo</div>
  <button class="menu-btn lb-btn" type="button">
    <span class="menu-ill lb-img lb-notag lb-flat"></span>
    <span class="lb-icon"></span>
    <span class="lb-label">Menu</span>
  </button>
  <nav class="panel">
    <a class="lb-link">Link one</a>
    <a class="lb-link">Link two</a>
    <a class="lb-link">Link three</a>
    <a class="lb-link">Link four</a>
  </nav>
  <script type="text/lb">
    const btn = root.querySelector('.menu-btn');
    const onClick = () => root.classList.toggle('open');
    btn.addEventListener('click', onClick);
    const onScroll = () => root.classList.toggle('scrolled', window.scrollY > 10);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    ctx.onCleanup(() => { btn.removeEventListener('click', onClick); window.removeEventListener('scroll', onScroll); });
  </script>
</header>
