<section class="lb-root">
  <style>
    .lb-root { border-top: 1px solid var(--lb-line); padding: calc(var(--lb-space) * 2) var(--lb-gutter) var(--lb-space); }
    .lb-root .in { max-width: 30%; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: var(--lb-gap); text-align: center; overflow-wrap: anywhere; }
    .lb-root .lb-h1 { font-size: clamp(28px, 4vw, 56px); }
    @media (max-width: 640px) { .lb-root .in { max-width: 80%; } }
  </style>
  <div class="in">
    <div class="lb-h1 lb-center">Large title goes here</div>
    <div class="lb-text lb-center">Subtitle text goes here.</div>
  </div>
</section>
