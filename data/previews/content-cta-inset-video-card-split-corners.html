<section class="lb-root">
  <style>
    .lb-root { padding: var(--lb-space) var(--lb-gutter); background: var(--lb-bg); }
    .lb-root .card { position: relative; overflow: hidden; aspect-ratio: 10 / 4; border-radius: var(--lb-r-tl) var(--lb-r-tr) var(--lb-r-br) var(--lb-r-bl); }
    .lb-root .card .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .lb-root .content { position: relative; z-index: 1; height: 100%; box-sizing: border-box; padding: calc(var(--lb-pad) * 1.5); display: flex; flex-direction: column; justify-content: space-between; gap: var(--lb-gap); }
    .lb-root .top { display: flex; flex-direction: column; align-items: flex-start; gap: calc(var(--lb-gap) / 2); }
    .lb-root .top .title { margin: 0; max-width: 15%; }
    .lb-root .bottom { display: flex; align-items: center; justify-content: space-between; gap: var(--lb-gap); }
    @media (max-width: 640px) {
      .lb-root .card { aspect-ratio: 9 / 10; }
      .lb-root .top .title { max-width: 60%; }
      .lb-root .bottom .lb-btn { display: none; }
    }
  </style>
  <div class="card lb-card lb-nopad">
    <div class="bg lb-video lb-flat"></div>
    <div class="content">
      <div class="top">
        <h2 class="title lb-h3">Short title</h2>
        <span class="lb-label">Label</span>
      </div>
      <div class="bottom">
        <p class="lb-text">One short sentence describing the call to action.</p>
        <a class="lb-btn">Get started</a>
      </div>
    </div>
  </div>
</section>
