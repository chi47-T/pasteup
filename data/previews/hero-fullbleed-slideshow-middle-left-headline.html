<section class="lb-root">
  <style>
    .lb-root { position: relative; display: flex; align-items: center; overflow: hidden; box-sizing: border-box; }
    .lb-root[data-header="overlay"] { min-height: 100vh; min-height: 100svh; padding-top: var(--header-h); }
    .lb-root[data-header="below"], .lb-root[data-header="inset"] { min-height: calc(100vh - var(--header-h)); min-height: calc(100svh - var(--header-h)); }
    .lb-root[data-header="after"] { min-height: 100vh; min-height: 100svh; }
    .lb-root .slides { position: absolute; inset: 0; }
    .lb-root .slide { position: absolute; inset: 0; opacity: 0; transition: opacity .8s; }
    .lb-root .slide.on { opacity: 1; }
    .lb-root .slide .lb-img { width: 100%; height: 100%; }
    .lb-root .lb-wrap { position: relative; z-index: 2; width: 100%; box-sizing: border-box; }
    .lb-root .txt { width: 33%; min-width: 260px; text-align: left; }
    .lb-root .dots { position: absolute; z-index: 3; left: 0; right: 0; bottom: var(--lb-gap); display: flex; justify-content: center; gap: 8px; }
    .lb-root .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--lb-line); }
    .lb-root .dot.on { background: var(--lb-accent); }
    @media (max-width: 640px) {
      .lb-root .txt { width: 100%; min-width: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .lb-root .slide { transition: none; } }
  </style>
  <div class="slides">
    <div class="slide on"><div class="lb-img lb-flat lb-tag-br"></div></div>
    <div class="slide"><div class="lb-img lb-flat lb-tag-br"></div></div>
    <div class="slide"><div class="lb-img lb-flat lb-tag-br"></div></div>
  </div>
  <div class="lb-wrap">
    <div class="txt"><h1 class="lb-h1">Headline goes here</h1></div>
  </div>
  <div class="dots" data-acc="0"><span class="dot on"></span><span class="dot"></span><span class="dot"></span></div>
  <script type="text/lb">
    const s = root.querySelectorAll('.slide'), d = root.querySelectorAll('.dot');
    let i = 0;
    const show = n => { i = n; s.forEach((e, k) => e.classList.toggle('on', k === n)); d.forEach((e, k) => e.classList.toggle('on', k === n)); };
    if (!ctx.reducedMotion) {
      const t = setInterval(() => show((i + 1) % s.length), 4000);
      ctx.onCleanup(() => clearInterval(t));
    }
  </script>
</section>
