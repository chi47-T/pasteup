<section class="lb-root">
  <style>
    .lb-root { padding: var(--lb-space) 0; overflow-x: clip; }
    .lb-root .head { margin-bottom: var(--lb-gap); text-align: left; }
    .lb-root .grid { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 120px); gap: var(--lb-gap); justify-content: start; }
    .lb-root .item { aspect-ratio: 1 / 1; padding: var(--lb-pad); display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
    .lb-root .item .lb-img { width: 100%; height: 100%; }
    @media (max-width: 640px) {
      .lb-root .grid { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); justify-content: stretch; }
    }
  </style>
  <div class="lb-wrap">
    <div class="head"><h2 class="lb-h2">Headline goes here</h2></div>
    <div class="grid">
      <div class="lb-card item"><div class="lb-img lb-notag"></div></div>
      <div class="lb-card item"><div class="lb-img lb-notag"></div></div>
      <div class="lb-card item"><div class="lb-img lb-notag"></div></div>
      <div class="lb-card item"><div class="lb-img lb-notag"></div></div>
      <div class="lb-card item"><div class="lb-img lb-notag"></div></div>
      <div class="lb-card item"><div class="lb-img lb-notag"></div></div>
      <div class="lb-card item"><div class="lb-img lb-notag"></div></div>
    </div>
  </div>
</section>
