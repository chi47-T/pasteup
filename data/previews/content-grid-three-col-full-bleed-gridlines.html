<section class="lb-root">
  <style>
    .lb-root { padding: var(--lb-space) 0; }
    .lb-root .head { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: var(--lb-space); padding: 0 var(--lb-gutter); }
    .lb-root .grid { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--lb-line); border-bottom: 1px solid var(--lb-line); }
    .lb-root .cell { display: flex; flex-direction: column; gap: var(--lb-gap); padding: var(--lb-pad); min-width: 0; }
    .lb-root .cell + .cell { border-left: 1px solid var(--lb-line); }
    .lb-root .pic { width: 100%; aspect-ratio: 3 / 4; }
    .lb-root .lb-link { overflow-wrap: anywhere; }
    @media (max-width: 640px) {
      .lb-root .grid { border: 0; margin: 0 var(--lb-gutter); gap: 8px; }
      .lb-root .cell { padding: 0; gap: 8px; }
      .lb-root .cell + .cell { border-left: 0; }
    }
  </style>
  <div class="head"><h2 class="lb-h2">Headline goes here</h2></div>
  <div class="grid">
    <div class="cell"><div class="lb-img lb-flat pic"></div><a class="lb-link">Link text one</a></div>
    <div class="cell"><div class="lb-img lb-flat pic"></div><a class="lb-link">Link text two</a></div>
    <div class="cell"><div class="lb-img lb-flat pic"></div><a class="lb-link">Link text three</a></div>
  </div>
</section>
